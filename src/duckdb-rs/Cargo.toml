[package]
name = "duckdb-rs"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
server = ["duckdb", "libduckdb-sys", "r2d2"]
client = []

default = ["client"]

[dependencies]
kyogre-core = { path = "../kyogre-core" }

fiskeridir-rs = { workspace = true }
stack-error = { workspace = true }
snafu = { workspace = true }
serde = { workspace = true }
config = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
orca-core = { workspace = true, features = ["telemetry"] }
num-traits = { workspace = true }
async-trait = { workspace = true }
humantime-serde = { workspace = true }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
] }
tokio-stream = { workspace = true, features = ["net"] }
http = { workspace = true }

duckdb = { version = "1", features = ["r2d2", "bundled"], optional = true }
libduckdb-sys = { version = "1", optional = true }
r2d2 = { version = "0.8", optional = true }

tonic = { version = "0.14.2", features = ["gzip"] }
prost = { version = "0.14" }
tonic-prost = { version = "0.14" }


[dev-dependencies]
duckdb-rs = { path = ".", features = ["server"] }
postgres = { path = "../postgres", features = ["test"] }
futures = { workspace = true }
orca-core = { workspace = true, features = ["test-helper"] }

[build-dependencies]
tonic-prost-build = "0.14"

[[ bin ]]
name = "duckdb"
path = "src/main.rs"
required-features = ["server"]
