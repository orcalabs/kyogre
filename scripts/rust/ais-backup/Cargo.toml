[package]
name = "ais-backup"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0.96"
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-native-tls",
    "postgres",
    "macros",
    "chrono",
    "json",
], default-features = false }
tokio = { version = "1.43.0", features = ["full"] }
zip = "9.2.2"
csv = "1.4.0"
azure_storage_blob = "1.1.0"
azure_identity = "1.0.0"
azure_core = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
md5 = "0.8.1"
async-channel = "2.5.0"
